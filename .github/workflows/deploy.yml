# Build do Astro e deploy no GitHub Pages a cada push na main (o pipeline da VPS commita as materias pela API).
# Variaveis do repositorio (Settings > Secrets and variables > Actions > Variables):
#   LANCADO   = 1 libera indexacao (padrao: fechado, noindex + robots Disallow)
#   SITE_URL  = origem do site (padrao https://cassianolibertech.github.io)
#   BASE_PATH = caminho base (padrao /radar-expanda; dominio proprio = /)
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          LANCADO: ${{ vars.LANCADO || '0' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://cassianolibertech.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/radar-expanda' }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
